<head>

    <title>Telegram kanal</title>

    <style>
        * {
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

        .card {

        }

        }

            color: #777;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .telegram-btn {

            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;

        .telegram-btn:hover {
